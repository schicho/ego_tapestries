<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition check</title>
    <!-- Load revisit-communicate to be able to send data to reVISit -->
    <script src="../../revisitUtilities/revisit-communicate.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .message {
            max-width: 40em;
            margin: 0 auto;
            padding: 12px 16px;
            border-radius: 6px;
        }

        .ok {
            background: #ebfbee;
            border: 1px solid #8ce99a;
        }

        .warning {
            background: #fff5f5;
            border: 1px solid #ff8787;
            color: #c92a2a;
        }

        h2 {
            margin-top: 0;
        }

        code {
            background: rgba(0, 0, 0, 0.06);
            padding: 1px 4px;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div id="message" class="message"></div>
</body>

<script>
    // The conditions of the study. The link to the study has to contain exactly one of them,
    // e.g. ?condition=normal or ?condition=collapsed. The study runs in the parent window of this page.
    const CONDITIONS = ["normal", "collapsed"];

    function getConditionFromUrl() {
        try {
            const condition = new URLSearchParams(window.parent.location.search).get("condition");
            return condition ? condition.trim() : null;
        } catch (e) {
            return null;
        }
    }

    function show(className, html) {
        const message = document.getElementById("message");
        message.className = `message ${className}`;
        message.innerHTML = html;
    }

    function check() {
        const condition = getConditionFromUrl();
        if (CONDITIONS.includes(condition)) {
            show("ok", "<h2>Everything is ready</h2><p>Click <b>Continue</b> to start.</p>");
            // The answer is required in the study, so the continue button is only enabled after this
            Revisit.postAnswers({ conditionCheck: [condition] });
        } else {
            show(
                "warning",
                "<h2>The link of this study is incomplete</h2>" +
                "<p>The study cannot be started, because the web address does not contain the " +
                "study condition. Please open the link that you were sent again, " +
                "in a new (private) browser window. The address ends with <code>?condition=…</code>.</p>" +
                "<p>If you do not have this link, please contact the researcher.</p>"
            );
        }
    }

    // Show the warning right away, and (re)check when reVISit sends its data to this page
    check();
    Revisit.onDataReceive(check);
</script>

</html>
