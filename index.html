<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🧬</text></svg>">
    <link rel="stylesheet" href="style.css">
    <title>Ego Tapestries</title>
</head>

<body>
    <div>
        <button class="view-button" id="smallstarwars">Small Star Wars</button>
        <button class="view-button" id="lesmiserables">Les Misérables</button>
        <button class="view-button" id="g01">Large Graph 01</button>
        <button class="view-button" id="g02">Large Graph 02</button>
        <button class="view-button" id="g03">Large Graph 03</button>
        <button class="view-button" id="ieeevis">IEEE VIS Co-Authorship</button>
    </div>
</body>

<script type="module">
    import { init, setRenderType, setLayoutType } from "./src/js/main.js";

    const SMALL_STAR_WARS = "./data/star_wars_4_adapted.edges.json";
    const LES_MISERABLES = "./data/miserables.edges.json";
    const GRAPH01 = "./data/biofabric_graph_01_edgelist.json";
    const GRAPH02 = "./data/graph_02_edge_list.json";
    const GRAPH03 = "./data/graph_03_edge_list.json"
    const IEEEVIS = "./data/ieeevis-co-authorship.json"


    const buttons = [...document.querySelectorAll(".view-button")];

    buttons.forEach(btn => {
        btn.addEventListener("click", () => {
            const btnid = btn.id;
            if (btnid === "smallstarwars") {
                init({ dataPath: SMALL_STAR_WARS })
            } else if (btnid === "lesmiserables") {
                init({ dataPath: LES_MISERABLES })
            } else if (btnid === "g01") {
                init({ dataPath: GRAPH01 })
            } else if (btnid === "g02") {
                init({ dataPath: GRAPH02 })
            } else if (btnid === "g03") {
                init({ dataPath: GRAPH03 })
            } else if (btnid === "ieeevis") {
                init({ dataPath: IEEEVIS })
            }
        });
    });

    init();
</script>

</html>
